mqtt:
  button:
    - name: "Reconnect"
      command_topic: "phev2mqtt/reconnect/set"
      payload_press: "reconnect"
      unique_id: phev_reconnect_button
      default_entity_id: button.phev_reconnect
      # The PHEV Gateway device, named once here and reused below with
      # *phev_gateway (both must be in the same file).
      device: &phev_gateway
        identifiers: ["phev2mqtt_gateway"]
        name: "PHEV Gateway"
        manufacturer: "phev2mqtt"
        model: "Debian 13 VM"

    - name: "Restart Service"
      command_topic: "phev2mqtt/service/restart"
      payload_press: "restart"
      unique_id: phev_service_restart_button
      default_entity_id: button.phev_restart_service
      icon: mdi:restart
      device: *phev_gateway

    - name: "WiFi Driver Reload"
      command_topic: "phev2mqtt/hardreset/set"
      payload_press: "hardreset"
      unique_id: phev_hardreset_button
      default_entity_id: button.phev_wifi_driver_reload
      icon: mdi:wifi-cog
      device: *phev_gateway

    - name: "Reboot VM"
      command_topic: "phev2mqtt/reboot/set"
      payload_press: "reboot"
      unique_id: phev_reboot_button
      default_entity_id: button.phev_reboot_vm
      icon: mdi:restart-alert
      device: *phev_gateway

    - name: "Rollback phev2mqtt"
      command_topic: "phev2mqtt/rollback/set"
      payload_press: "rollback"
      unique_id: phev_rollback_button
      default_entity_id: button.phev_rollback_phev2mqtt
      icon: mdi:backup-restore
      device: *phev_gateway

  switch:
    - name: "WiFi"
      command_topic: "phev2mqtt/wifi/set"
      state_topic: "phev2mqtt/wifi/enabled"
      payload_on: "ON"
      payload_off: "OFF"
      state_on: "ON"
      state_off: "OFF"
      unique_id: phev_wifi_switch
      default_entity_id: switch.phev_wifi
      device: *phev_gateway

  sensor:
    - name: "WiFi IP"
      state_topic: "phev2mqtt/wifi/ip"
      unique_id: phev_wifi_ip
      default_entity_id: sensor.phev_wifi_ip
      device: *phev_gateway
    - name: "WiFi Signal"
      state_topic: "phev2mqtt/wifi/signal"
      unit_of_measurement: "dBm"
      unique_id: phev_wifi_signal
      default_entity_id: sensor.phev_wifi_signal
      device: *phev_gateway
    - name: "WiFi SSID"
      state_topic: "phev2mqtt/wifi/ssid"
      unique_id: phev_wifi_ssid
      default_entity_id: sensor.phev_wifi_ssid
      device: *phev_gateway
    - name: "WiFi Status"
      state_topic: "phev2mqtt/wifi/status"
      unique_id: phev_wifi_status
      default_entity_id: sensor.phev_wifi_status
      device: *phev_gateway

    - name: "Service State"
      state_topic: "phev2mqtt/service/state"
      unique_id: phev_service_state
      default_entity_id: sensor.phev_service_state
      icon: mdi:cog-sync
      # Unavailable when the VM stops reporting (it reports every 30 s).
      expire_after: 120
      device: *phev_gateway
    - name: "Service Uptime"
      state_topic: "phev2mqtt/service/uptime"
      unique_id: phev_service_uptime_friendly
      default_entity_id: sensor.phev_service_uptime_friendly
      icon: mdi:timer
      # The VM reports seconds; shown as "2d 3h 14m", "2h 14m" or "14m".
      value_template: >-
        {%- set s = value | int(0) -%}
        {%- set d = s // 86400 -%}
        {%- set h = (s % 86400) // 3600 -%}
        {%- set m = (s % 3600) // 60 -%}
        {%- if d > 0 -%}{{ d }}d {{ h }}h {{ m }}m
        {%- elif h > 0 -%}{{ h }}h {{ m }}m
        {%- else -%}{{ m }}m{%- endif -%}
      device: *phev_gateway
    - name: "Running Build"
      state_topic: "phev2mqtt/service/build"
      unique_id: phev_service_build
      default_entity_id: sensor.phev_running_build
      icon: mdi:source-branch
      device: *phev_gateway

    - name: "Watchdog Last Action"
      state_topic: "phev2mqtt/watchdog/action"
      unique_id: phev_watchdog_action
      default_entity_id: sensor.phev_watchdog_last_action
      icon: mdi:robot-outline
      device: *phev_gateway

# Keep the uptime out of Home Assistant's history and logbook: it changes
# every minute, and restarts already show in Service State. If you already
# have a recorder: section, add the entity to its exclude list instead.
# Needs a restart of Home Assistant.
recorder:
  exclude:
    entities:
      - sensor.phev_service_uptime_friendly
